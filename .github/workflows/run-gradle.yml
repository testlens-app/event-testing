on:
  workflow_call:
    inputs:
      tests:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4
        with:
          cache-read-only: false
      # Use setup-testlens action once it is public
      # - uses: testlens-app/setup-testlens@main
      - name: Add init script
        run: |
          cat << 'EOF' > $GRADLE_USER_HOME/init.d/testlens-init.gradle
          gradle.settingsEvaluated { settings ->
            settings.dependencyResolutionManagement.repositories {
              maven { 
                url = 'https://central.sonatype.com/repository/maven-snapshots'
              }
            }
          }
          gradle.allprojects {
            plugins.withId('java') {
              testing.suites.configureEach {
                dependencies { runtimeOnly('app.testlens:junit-platform-instrumentation:0.1.0-SNAPSHOT') }
              }
            }
            tasks.withType(Test).configureEach {
              systemProperty('app.testlens.project-id', '${{ github.repository }}')
              systemProperty('app.testlens.work-unit-path', path)
              systemProperty('app.testlens.github-token', '${{ secrets.GITHUB_TOKEN }}')
              systemProperty('app.testlens.server-address', '${{ vars.TESTLENS_SERVER }}')
              systemProperty('app.testlens.use-plaintext', '${{ vars.GRPC_PLAINTEXT }}')
            }
          }
          EOF
      - run: ./gradlew build -PignoreFailures=true
        if: github.event_name == 'push' || !startsWith(github.ref, 'refs/heads/testing/')
        env:
          GITHUB_TOKEN: ${{ secrets.TESTLENS_BOT_GITHUB_TOKEN }}
      - run: ./gradlew test --tests ${{inputs.tests}} build -PmaxRetries=${{ vars.MAX_RETRIES || 0 }}
        if: github.event_name != 'push' && startsWith(github.ref, 'refs/heads/testing/')
        env:
          GITHUB_TOKEN: ${{ secrets.TESTLENS_BOT_GITHUB_TOKEN }}
