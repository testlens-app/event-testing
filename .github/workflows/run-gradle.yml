on:
  workflow_call:
    inputs:
      tests:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          cache-read-only: false
      - uses: testlens-app/setup-testlens@e6acded0a252395e1d1bc6a55c8ed17623f0ae68 # main
        with:
          instrumentation-version: latest # uploaded to local repo by end2end test
          write-log-files: true
      - name: Add init script
        run: |
          cat << 'EOF' > $GRADLE_USER_HOME/init.d/testlens-init-end2end-testing.gradle
          gradle.allprojects {
            tasks.withType(Test).configureEach {
              systemProperty('app.testlens.server-address', '${{ vars.TESTLENS_SERVER }}')
              systemProperty('app.testlens.use-plaintext', '${{ vars.GRPC_PLAINTEXT }}')
            }
          }
          EOF
      - run: ./gradlew build -x test
        if: github.event_name == 'push' || !startsWith(github.head_ref, 'testing/')
        env:
          GITHUB_TOKEN: ${{ secrets.TESTLENS_BOT_GITHUB_TOKEN }}
      - run: ./gradlew test --tests ${{inputs.tests}} build
        if: github.event_name != 'push' && startsWith(github.head_ref, 'testing/')
        env:
          GITHUB_TOKEN: ${{ secrets.TESTLENS_BOT_GITHUB_TOKEN }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: "TestLens logs (${{ job.check_run_id }})"
          path: "**/testlens-logs/**"
