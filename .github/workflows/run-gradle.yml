on:
  workflow_call:
    inputs:
      tests:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
      - uses: testlens-app/setup-testlens@e06eb47388f46d3f262426be5534043b23991adb # main
        with:
          instrumentation-version: latest # uploaded to local repo by end2end test
          write-log-files: true
      - name: Add init script
        run: |
          cat << 'EOF' > $GRADLE_USER_HOME/init.d/testlens-init-end2end-testing.gradle
          gradle.allprojects {
            tasks.withType(Test).configureEach {
              systemProperty('app.testlens.server-address', '${{ vars.TESTLENS_SERVER }}')
              systemProperty('app.testlens.use-plaintext', '${{ vars.GRPC_PLAINTEXT }}')
            }
          }
          EOF
      - run: ./gradlew build -x test
        if: github.event_name == 'push' || !startsWith(github.head_ref, 'testing/')
        env:
          GITHUB_TOKEN: ${{ secrets.TESTLENS_BOT_GITHUB_TOKEN }}
      - run: ./gradlew test --tests ${{inputs.tests}} build
        if: github.event_name != 'push' && startsWith(github.head_ref, 'testing/')
        env:
          GITHUB_TOKEN: ${{ secrets.TESTLENS_BOT_GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: "TestLens logs (${{ job.check_run_id }})"
          path: "**/testlens-logs/**"
